# Skarv Ventures deal-flow triage — the one visible scoring and rules config.
# Every number the pipeline uses to filter, score or flag a deal lives here.

# The demo's fixed "today" (spec: treat today as 2026-09-30).
demo_today: 2026-09-30

# Score = the Fathom investment criteria.
# A person rates each dimension 1 (weak) to 5 (strong); the pipeline never fills them.
# Score % = sum(weight × rating / scale_max); unrated dimensions add nothing.
# The weights are percentages and must add up to 100.
fathom:
  scale_max: 5
  weights:
    team: 20
    market: 15
    problem_solution_fit: 15
    technology_product: 10
    business_model: 10
    traction_validation: 10
    competition: 5
    go_to_market: 5
    financials: 5
    exit_potential: 5
  # Storytelling & design: bonus points on top (0–5), the total capped at 100 %.
  storytelling_bonus_max: 5
  # Score interpretation, highest band first: a deal's band is the first whose min it reaches.
  # Shown once all ten dimensions are rated.
  bands:
    - { min: 90, label: "Investable – strong" }
    - { min: 75, label: "Investable, minor gaps" }
    - { min: 60, label: "Watchlist – gaps remain" }
    - { min: 40, label: "Not investable – too many open questions" }
    - { min: 0, label: "No fit – fundamentally unsuitable" }

hard_filters:
  stages: [Pre-Seed, Seed]
  countries:
    # Quoted: unquoted NO is read by YAML as false ("the Norway problem").
    nordics: ["DK", "SE", "NO", "FI", "IS"]
    dach: ["DE", "AT", "CH"]
  # Implied Skarv ticket = round_size_eur × implied_ticket_share (user decision
  # 2026-09-30: 40% of the round), and must fall within the fund's ticket range.
  implied_ticket_share: 0.4
  ticket_min_eur: 500000
  ticket_max_eur: 2000000

# Time in queue never changes the score; it only raises these flags.
queue_flags:
  decide_this_week_days: 14
  decision_required_days: 21

# Warm intros must get a reply within this many working days (weekends skipped).
intro_reply_working_days: 3

# Fuzzy company-name match threshold (Jaro-Winkler) for a suggested merge.
suggested_merge_similarity: 0.92

worklist_size: 20

# Urgency Score: how pressing a deal is, built like the LP scoring matrix: five dimensions
# with point tables, a raw sum out of 120, normalised to 0–100 (round(raw / 120 × 100)) and
# reported as both, e.g. "77/100 (raw 92/120)". Priority = Quality Score × Urgency Score.
# Time in queue is never an input (user decision 2026-09-30): it only raises the 14/21-day flags.
urgency:
  # 1. Reply obligation (0–40): an open warm intro, by its reply-deadline stage.
  reply_obligation:
    overdue: 40
    due_today: 36
    reminder: 30
    open: 24
    none: 0
  # 2. Relationship proximity (0–20): how close the founder is to the team.
  relationship:
    warm_intro: 20       # introduced by an LP, a portfolio founder or an angel
    repeat_contact: 10   # reached out on two or more channels
    cold: 4              # a single cold inbound: identifiable, but no relationship
  # 3. Activity signal (0–25): how recent the latest signal (hire, traction, news, round) is.
  activity:
    - { days: 14, points: 25 }
    - { days: 45, points: 16 }
    - { days: 90, points: 8 }
    - { days: 180, points: 3 }
  # 4. Competitive pressure (0–20): what the latest signal says, if it is recent enough.
  competitive_pressure_days: 90
  competitive_pressure:
    round_announced: 20  # another lead may be closing the round: decide or lose it
    traction_update: 14
    senior_hire: 10
    news: 6
  # 5. Founder momentum (0–15): how recently the founder last got in touch.
  momentum:
    - { days: 7, points: 15 }
    - { days: 21, points: 8 }
  # Tiers on the normalised score, highest first, with what to do.
  tiers:
    - { min: 80, label: "Act today", action: "Reply or decide today; something is overdue or about to be lost." }
    - { min: 60, label: "This week", action: "Put it on this week's list." }
    - { min: 40, label: "Soon", action: "Look at it once this week's urgent deals are done." }
    - { min: 20, label: "Monitor", action: "Nothing pressing; watch for new signals." }
    - { min: 0, label: "No rush", action: "No obligation and no recent news." }

# Cockpit quick filters.
cockpit:
  new_startup_days: 7
  # Hot topics: signals from the last this-many days.
  hot_topic_days: 45
  long_tracking_days: 90

# Priority matrix: where the quadrant lines sit (Quality and Urgency Score, both 0-100).
# Score split 60 is the Fathom watchlist line; urgency split 40 is where the "Soon" tier
# starts: in the demo data it puts every open warm intro (49 and up) on the urgent side, and
# the rest (3–42) below it unless a very fresh, strong signal lifts it over.
matrix:
  score_split: 60
  urgency_split: 40
