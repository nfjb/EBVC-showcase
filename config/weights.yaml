# Skarv Ventures deal-flow triage — the one visible scoring and rules config.
# Every number the pipeline uses to filter, score or flag a deal lives here.

# The demo's fixed "today" (spec: treat today as 2026-09-30).
demo_today: 2026-09-30

# Score = the Fathom investment criteria.
# A person rates each dimension 1 (weak) to 5 (strong); the pipeline never fills them.
# Score % = sum(weight × rating / scale_max); unrated dimensions add nothing.
# The weights are percentages and must add up to 100.
fathom:
  scale_max: 5
  weights:
    team: 20
    market: 15
    problem_solution_fit: 15
    technology_product: 10
    business_model: 10
    traction_validation: 10
    competition: 5
    go_to_market: 5
    financials: 5
    exit_potential: 5
  # Storytelling & design: bonus points on top (0–5), the total capped at 100 %.
  storytelling_bonus_max: 5
  # Score interpretation, highest band first: a deal's band is the first whose min it reaches.
  # Shown once all ten dimensions are rated.
  bands:
    - { min: 90, label: "Investable – strong" }
    - { min: 75, label: "Investable, minor gaps" }
    - { min: 60, label: "Watchlist – gaps remain" }
    - { min: 40, label: "Not investable – too many open questions" }
    - { min: 0, label: "No fit – fundamentally unsuitable" }

hard_filters:
  stages: [Pre-Seed, Seed]
  countries:
    # Quoted: unquoted NO is read by YAML as false ("the Norway problem").
    nordics: ["DK", "SE", "NO", "FI", "IS"]
    dach: ["DE", "AT", "CH"]
  # Implied Skarv ticket = round_size_eur × implied_ticket_share (user decision
  # 2026-09-30: 40% of the round), and must fall within the fund's ticket range.
  implied_ticket_share: 0.4
  ticket_min_eur: 500000
  ticket_max_eur: 2000000

# Time in queue never changes the score; it only raises these flags.
queue_flags:
  decide_this_week_days: 14
  decision_required_days: 21

# Warm intros must get a reply within this many working days (weekends skipped).
intro_reply_working_days: 3

# Fuzzy company-name match threshold (Jaro-Winkler) for a suggested merge.
suggested_merge_similarity: 0.92

worklist_size: 20

# Urgency (0-100) orders the cockpit together with the score: priority = score % x urgency.
# It comes only from obligations and news, never from days in queue (user decision
# 2026-09-30): an open warm intro sets it by its reply-deadline stage; otherwise the base
# value plus a bonus for a recent signal.
urgency:
  base: 30
  intro_overdue: 95
  intro_due_today: 90
  intro_reminder: 80
  intro_open: 70
  recent_signal_days: 14
  recent_signal_bonus: 25
  signal_days: 45
  signal_bonus: 15

# Cockpit quick filters.
cockpit:
  new_startup_days: 7
  long_tracking_days: 90

# Priority matrix: where the quadrant lines sit (Fathom score % and urgency, both 0-100).
# Score split 60 is the Fathom watchlist line; urgency 60 separates open warm-intro
# obligations (70+) from the rest.
matrix:
  score_split: 60
  urgency_split: 60
